<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Account — VitaePro</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./design-system.css?v=2" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>

  <header class="page-header">
    <div class="header-row">
      <button class="header-back" onclick="location.href='m-dashboard.html'" aria-label="Back">←</button>
      <h1>Account</h1>
      <div style="width:44px"></div>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="page-content">

      <!-- Email (read-only) -->
      <div class="card mb-3">
        <div class="card-header">
          <div class="card-title">Email</div>
        </div>
        <div class="card-body">
          <span id="acctEmail" class="text-muted">—</span>
        </div>
      </div>

      <!-- Profile details -->
      <div class="section-title">Profile Details</div>
      <p class="section-subtitle">Used to personalise your cover letters.</p>

      <div class="form-group">
        <label class="form-label" for="acctFirstName">First Name</label>
        <input class="form-input" id="acctFirstName" placeholder="Jane" />
      </div>

      <div class="form-group">
        <label class="form-label" for="acctLastName">Last Name</label>
        <input class="form-input" id="acctLastName" placeholder="Smith" />
      </div>

      <div class="form-group">
        <label class="form-label" for="acctPhone">Phone</label>
        <input class="form-input" id="acctPhone" type="tel" placeholder="0400 000 000" />
      </div>

      <div class="form-group">
        <label class="form-label" for="acctAddress1">Address Line 1</label>
        <input class="form-input" id="acctAddress1" placeholder="123 Main St" />
      </div>

      <div class="form-group">
        <label class="form-label" for="acctAddress2">Address Line 2</label>
        <input class="form-input" id="acctAddress2" placeholder="Suburb, State 3000" />
      </div>

      <button class="btn btn-primary btn-lg btn-full" id="saveProfileBtn">Save Profile</button>

      <!-- Resume -->
      <div class="section-title" style="margin-top:32px">Resume</div>
      <p class="section-subtitle">Used for Quick Apply and cover letter generation. Upload a .txt file or paste your resume below (for PDF or Word, copy the text and paste it here).</p>

      <div class="card mb-3" id="resumeCard">
        <div class="card-header">
          <div class="card-title">Your resume</div>
          <span class="text-sm text-muted" id="resumeStatus">No resume</span>
        </div>
        <div class="card-body">
          <input type="file" id="resumeFileInput" accept=".txt" class="form-input" style="margin-bottom:12px" />
          <label class="form-label" for="resumeTextarea">Or paste resume text</label>
          <textarea class="form-input form-textarea" id="resumeTextarea" placeholder="Paste your resume text here…" rows="6"></textarea>
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
            <button type="button" class="btn btn-primary" id="saveResumeBtn">Save resume</button>
            <button type="button" class="btn btn-ghost" id="removeResumeBtn" style="display:none">Remove resume</button>
          </div>
        </div>
      </div>

      <hr style="margin:32px 0;border-color:var(--vp-border)" />

      <!-- Danger zone -->
      <button class="btn btn-ghost btn-lg btn-full" id="logoutBtn" style="color:var(--color-danger)">Log Out</button>

    </div>
  </div>

  <nav class="bottom-nav">
    <a href="m-dashboard.html"><span class="nav-icon">🏠</span><span>Home</span></a>
    <a href="m-applications.html"><span class="nav-icon">📄</span><span>Applications</span></a>
    <a href="m-library.html"><span class="nav-icon">📚</span><span>Library</span></a>
    <a href="m-account.html" class="active"><span class="nav-icon">👤</span><span>Account</span></a>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="./m-auth.js"></script>
  <script src="m-api.js"></script>
  <script src="m-app.js"></script>
  <script>VPApp.initAccount();</script>

<!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-95CE0CEWFW');
</script>
</body>
</html>
