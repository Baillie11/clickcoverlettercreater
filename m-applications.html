<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Applications — VitaePro</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./design-system.css?v=2" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>

  <header class="page-header">
    <div class="header-row">
      <button class="header-back" onclick="location.href='m-dashboard.html'" aria-label="Back">←</button>
      <h1>My Applications</h1>
      <div style="width:44px"></div>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="page-content">

      <!-- Filter tabs -->
      <div class="tab-bar" style="margin-bottom:16px">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="draft">Drafts</button>
        <button class="tab" data-filter="applied">Applied</button>
        <button class="tab" data-filter="interview">Interview</button>
      </div>

      <div id="appsList">
        <div style="text-align:center;padding:40px 0">
          <div class="spinner" style="margin:0 auto"></div>
        </div>
      </div>

    </div>
  </div>

  <nav class="bottom-nav">
    <a href="m-dashboard.html"><span class="nav-icon">🏠</span><span>Home</span></a>
    <a href="m-applications.html" class="active"><span class="nav-icon">📄</span><span>Applications</span></a>
    <a href="m-library.html"><span class="nav-icon">📚</span><span>Library</span></a>
    <a href="m-account.html"><span class="nav-icon">👤</span><span>Account</span></a>
  </nav>

  <div class="toast" id="toast"></div>

  <!-- Edit Application modal -->
  <div class="modal-overlay" id="editAppModal" aria-hidden="true">
    <div class="modal-sheet">
      <div class="modal-handle" aria-hidden="true"></div>
      <h2 class="modal-title">Edit application</h2>
      <p class="text-sm text-muted" id="editAppRoleCompany"></p>
      <div class="form-group">
        <label class="form-label" for="editAppStatus">Status</label>
        <select class="form-input form-select" id="editAppStatus">
          <option value="Applied">✉️ Applied</option>
          <option value="Draft">📄 Draft</option>
          <option value="Interview Scheduled">📞 Interview Scheduled</option>
          <option value="Interview Complete">✅ Interview Complete</option>
          <option value="Assessment Pending">📋 Assessment Pending</option>
          <option value="Offer Made">🎉 Offer Made</option>
          <option value="Offer Accepted">🏆 Offer Accepted</option>
          <option value="Rejected">❌ Rejected</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="editAppNotes">Notes</label>
        <textarea class="form-input form-textarea" id="editAppNotes" rows="3" placeholder="Add notes about this application…"></textarea>
      </div>
      <div style="display:flex;gap:12px;margin-top:16px">
        <button type="button" class="btn btn-ghost btn-full" id="editAppCancelBtn">Cancel</button>
        <button type="button" class="btn btn-primary btn-full" id="editAppSaveBtn">Save changes</button>
      </div>
    </div>
  </div>

  <script src="./m-auth.js"></script>
  <script src="m-api.js"></script>
  <script src="m-app.js"></script>
  <script>
    VPApp.initApplications();

    // Filter tabs
    document.querySelectorAll('.tab[data-filter]').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab[data-filter]').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const filter = tab.dataset.filter;
        document.querySelectorAll('#appsList .card').forEach(card => {
          if (filter === 'all') { card.style.display = ''; return; }
          const status = (card.querySelector('.badge')?.textContent || '').toLowerCase();
          card.style.display = status.includes(filter) ? '' : 'none';
        });
      });
    });
  </script>

<!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-95CE0CEWFW');
</script>
</body>
</html>
