      <button class="header-back" onclick="history.back()" aria-label="Back">←</button>
      <h1>Preview</h1>
      <div style="width:44px"></div>
    </div>
    <div class="step-progress">
      <div class="step-dot completed">✓</div>
      <div class="step-line completed"></div>
      <div class="step-dot completed">✓</div>
      <div class="step-line completed"></div>
      <div class="step-dot completed">✓</div>
      <div class="step-line completed"></div>
      <div class="step-dot completed">✓</div>

      <div class="step-dot completed">✓</div>

  <div class="page-wrapper">
    <div class="page-content">

      <!-- Recruiter Certified Badges (shown if applicable) -->
      <div class="cert-badges hidden" id="certBadges">

        <span class="cert-badge">✔ ATS Optimised</span>
        <span class="cert-badge">✔ Tailored to Job</span>
      </div>

      <!-- Theme Selector -->
      <div class="form-group">
        <label class="form-label" for="themeSelect">Letter Theme</label>
        <select class="form-select" id="themeSelect">
          <option value="standard">Standard</option>
          <option value="modern-centered">Modern Centered</option>
          <option value="formal-classic">Formal Classic</option>
        </select>
      </div>

      <!-- Letter Preview -->
      <div class="letter-preview-frame" id="letterPreview">
        <!-- Rendered by JS -->
      </div>

    </div>
  </div>

  <div class="sticky-bottom">
    <div class="sticky-bottom-row">
      <button class="btn btn-secondary btn-lg" id="editBtn">✏️ Edit</button>
      <button class="btn btn-primary btn-lg" id="downloadBtn">📥 Download PDF</button>
    </div>
    <button class="btn btn-success btn-full mt-2" id="saveBtn">💾 Save Application</button>
  </div>

  <nav class="bottom-nav">
    <a href="m-dashboard.html"><span class="nav-icon">🏠</span><span>Home</span></a>
